[tox]
skipsdist = True
envlist =
    {py38}-django-{42}
    {py39}-django-{42}
    {py310}-django-{42,52}
    {py311}-django-{42,52}
    {py312}-django-{42,52,60,61}
    {py313}-django-{52,60,61}
    {py314}-django-{52,60,61}
    isort
    flake8
    mypy

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}
deps =
    coverage
    packaging>=24.0
    django-42: Django>=4.2,<5.0
    django-52: Django>=5.2,<6.0
    django-60: Django>=6.0,<6.1
    django-61: Django>=6.1,<6.2

commands =
    python \
        -W error::DeprecationWarning \
        -W error::PendingDeprecationWarning \
        -W ignore:::site \
        -W ignore:::distutils \
        -m coverage run \
        {toxinidir}/runtests.py {posargs}

[testenv:docs]
basepython = python
changedir = docs
deps =
    sphinx
    sphinx_rtd_theme
    Django>=6.1,<6.2
commands =
    sphinx-build -W -b html -d build/doctrees . build/html

[testenv:mypy]
usedevelop = false
basepython = python3.14
deps =
    mypy
    Django>=6.1,<6.2
    django-stubs
    types-setuptools
commands = mypy --config-file mypy.ini {posargs: safedelete}

[testenv:flake8]
usedevelop = false
basepython = python3.14
deps = flake8
commands = flake8 --ignore=E501,W504 safedelete

[testenv:isort]
usedevelop = false
basepython = python3.14
deps = isort
commands = isort .

[isort]
skip_gitignore = true
include_trailing_comma = true
multi_line_output = 3
line_length = 80
